# Existing application services; PostgreSQL and MinIO remain external and untouched.
# scripts/update-local-app.ps1 reuses credentials from the current backend process.
name: wfc-app
services:
  cad-converter:
    image: wfc/cad-converter:local
    build:
      context: .
      dockerfile: Dockerfile.cad-converter
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      WFC_CAD_CONVERTER_TOKEN: ${WFC_CAD_CONVERTER_TOKEN:?Configure the private CAD converter token}
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [application]

  backend:
    image: wfc/backend:local
    build:
      context: .
      target: api-runtime
      args:
        VITE_VIEWER_HARNESS: "false"
        VITE_CAD_DESIGN_ENABLED: "true"
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      WFC_CAD_DESIGN_ENABLED: ${WFC_CAD_DESIGN_ENABLED:-true}
      WFC_CAD_CONVERTER_URL: http://cad-converter:8090/convert
      WFC_CAD_CONVERTER_TOKEN: ${WFC_CAD_CONVERTER_TOKEN:?Configure the private CAD converter token}
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_USE_HTTPS: ${API_USE_HTTPS:-false}
      DATABASE_URL: ${DATABASE_URL:?Use the existing backend environment}
      JWT_SECRET: ${JWT_SECRET:?Use the existing backend environment}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://127.0.0.1:5180}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Use the existing backend environment}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Use the existing backend environment}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Use the existing backend environment}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_BUCKET_PROJECTS: ${MINIO_BUCKET_PROJECTS:-wfc-project-files}
      MINIO_BUCKET_TEMPLATES: ${MINIO_BUCKET_TEMPLATES:-wfc-template-files}
      MINIO_URL_EXPIRY_SECONDS: ${MINIO_URL_EXPIRY_SECONDS:-900}
      WFC_MODEL_BUCKET: ${WFC_MODEL_BUCKET:-wfc-models}
      PF_PREPARATION_CAPACITY_PROFILE: ${PF_PREPARATION_CAPACITY_PROFILE:-wfc.pf.bounded-512m-capture-and-model.v3}
      WFC_MODEL_IMPORT_ROOT: /var/lib/wfc/model-imports
      WFC_VIEWER_ALLOWED_ORIGINS: ${WFC_VIEWER_ALLOWED_ORIGINS:-http://127.0.0.1:5180,http://localhost:5180}
      WFC_VIEWER_ALLOW_HTTP_LOOPBACK: ${WFC_VIEWER_ALLOW_HTTP_LOOPBACK:-true}
      WFC_VIEWER_ALLOW_INSECURE_LAN_HTTP: ${WFC_VIEWER_ALLOW_INSECURE_LAN_HTTP:-false}
      WFC_VIEWER_TRUST_PROXY: ${WFC_VIEWER_TRUST_PROXY:-true}
    volumes:
      - model-imports:/var/lib/wfc/model-imports
      - pathfinder-data:/var/lib/wfc/pathfinder
    networks:
      application:
        aliases: [api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
  frontend:
    depends_on:
      backend:
        condition: service_healthy
    image: wfc/frontend:local
    build:
      context: .
      target: web-runtime
      args:
        VITE_API_URL: /
        VITE_VIEWER_HARNESS: "false"
        VITE_CAD_DESIGN_ENABLED: "true"
    restart: unless-stopped
    ports: ["${WFC_HTTP_BIND_ADDRESS:-127.0.0.1}:${WFC_HTTP_PORT:-5180}:80"]
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 5
networks:
  application:
    external: true
    name: wfc-app_application
volumes:
  model-imports:
  pathfinder-data:

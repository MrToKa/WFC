server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    add_header Content-Security-Policy "frame-src 'self'; object-src 'none'; base-uri 'self'" always;

    location ^~ /viewer-runtime/7.130.0/ {
        include /etc/nginx/mime.types;
        types { application/javascript mjs; }
        try_files $uri =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /viewer-runtime/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 404 '{"error":"Runtime not found"}';
    }

    location ~* "^/api/projects/(?<model_import_project>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/model-imports/?$" {
        auth_request /_model_import_authorize;
        error_page 401 =401 @model_import_unauthorized;
        error_page 403 =403 @model_import_forbidden;
        error_page 413 =413 @model_import_too_large;
        client_max_body_size 2147483648;
        client_body_timeout 900s;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /_model_import_authorize {
        internal;
        # The subrequest retains the original declared length, but forwards no body.
        client_max_body_size 2147483648;
        rewrite ^ /api/projects/$model_import_project/model-import-authorization break;
        proxy_pass http://api:4000;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Expect "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_intercept_errors on;
        error_page 404 =403 @model_import_forbidden;
    }

    location @model_import_forbidden {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"error":"Project editing access required"}';
    }

    location @model_import_unauthorized {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"error":"Authentication required"}';
    }

    location @model_import_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"code":"UPLOAD_LIMIT","error":"The package exceeds the upload limit."}';
    }

    # The policy API checks current authority and the declared 1 MiB bound
    # before reading a body. Forward the stream so nginx cannot buffer it first
    # or replace the exact policy error envelope with an HTML size error.
    location ~ "^/api/projects/[0-9a-f-]{36}/pathfinder/routing-permissions/?$" {
        client_max_body_size 0;
        client_body_timeout 60s;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
    }

    location ~* "^/api/projects/(?<pf_artifact_project>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/pathfinder/(artifacts|lookups)/?$" {
        auth_request /_pathfinder_artifact_authorize;
        error_page 401 =401 @pathfinder_artifact_unauthorized;
        error_page 403 =403 @pathfinder_artifact_forbidden;
        error_page 413 =413 @pathfinder_artifact_too_large;
        client_max_body_size 256m;
        client_body_timeout 300s;
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location = /_pathfinder_artifact_authorize {
        internal;
        client_max_body_size 256m;
        rewrite ^ /api/projects/$pf_artifact_project/pathfinder/authorization break;
        proxy_pass http://api:4000;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Expect "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_intercept_errors on;
        error_page 404 =403 @pathfinder_artifact_forbidden;
    }

    location @pathfinder_artifact_forbidden {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"code":"FORBIDDEN","error":"Administrator project access required"}';
    }

    location @pathfinder_artifact_unauthorized {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"code":"UNAUTHORIZED","error":"Authentication required"}';
    }

    location @pathfinder_artifact_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"code":"ARTIFACT_LIMIT","error":"The computational snapshot exceeds the upload limit."}';
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://api:4000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: wfc

services:
  cad-converter:
    image: wfc/cad-converter:local
    build:
      context: .
      dockerfile: Dockerfile.cad-converter
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      WFC_CAD_CONVERTER_TOKEN: ${WFC_CAD_CONVERTER_TOKEN:?Configure the private CAD converter token}
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [wfc-internal]

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    container_name: wfc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wfc_app}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - wfc-internal

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: wfc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - ./.data/minio:/data
    networks:
      - wfc-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    image: wfc-api:local
    container_name: wfc-api
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      WFC_CAD_DESIGN_ENABLED: "true"
      WFC_CAD_CONVERTER_URL: http://cad-converter:8090/convert
      WFC_CAD_CONVERTER_TOKEN: ${WFC_CAD_CONVERTER_TOKEN:?Configure the private CAD converter token}
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wfc_app}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-true}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_PROJECTS: ${MINIO_BUCKET_PROJECTS:-wfc-project-files}
      MINIO_BUCKET_TEMPLATES: ${MINIO_BUCKET_TEMPLATES:-wfc-template-files}
      MINIO_URL_EXPIRY_SECONDS: ${MINIO_URL_EXPIRY_SECONDS:-900}
      WFC_MODEL_BUCKET: ${WFC_MODEL_BUCKET:-wfc-models}
      WFC_PREPARER_INTERNAL_ORIGIN: ${WFC_PREPARER_INTERNAL_ORIGIN:-}
      WFC_PREPARER_PUBLIC_ORIGIN: ${WFC_PREPARER_PUBLIC_ORIGIN:-}
      WFC_MODEL_IMPORT_ROOT: /var/lib/wfc/model-imports
      WFC_VIEWER_ALLOWED_ORIGINS: ${WFC_VIEWER_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      WFC_VIEWER_ALLOW_HTTP_LOOPBACK: "true"
      WFC_VIEWER_ALLOW_INSECURE_LAN_HTTP: ${WFC_VIEWER_ALLOW_INSECURE_LAN_HTTP:-false}
      WFC_VIEWER_TRUST_PROXY: "true"
      # Aalborg's complete tray capture exceeds the legacy 32 MiB envelope.
      # Keep the project geometry input ceiling explicit in the normal installation.
      PF_PREPARATION_CAPACITY_PROFILE: ${PF_PREPARATION_CAPACITY_PROFILE:-wfc.pf.bounded-512m-capture-and-model.v3}
    volumes:
      - model-imports:/var/lib/wfc/model-imports
      - pathfinder-data:/var/lib/wfc/pathfinder
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - wfc-internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
      args:
        VITE_API_URL: /
        VITE_CAD_DESIGN_ENABLED: "true"
    image: wfc-web:local
    container_name: wfc-web
    restart: unless-stopped
    ports:
      - "${WFC_HTTP_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wfc-internal

networks:
  wfc-internal:
    name: wfc-internal

volumes:
  model-imports:
  pathfinder-data:


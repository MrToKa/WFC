name: Aalborg Routings Builder PoC checks

on:
  push:
    branches:
      - feature/aalborg-step-routings-builder-poc-20261110
    paths:
      - 'src/**'
      - 'server/**'
      - 'shared/**'
      - 'viewer-runtime/**'
      - 'scripts/poc/**'
      - 'compose.poc.yaml'
      - 'Dockerfile.poc-converter'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/aalborg-routings-builder-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aalborg-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Node 24 / TypeScript / Viewer protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests for CAD, access and Routings builder
        run: >
          npx vitest run --maxWorkers=1 --minWorkers=1
          src/viewer/componentTransforms.test.ts
          src/viewer/pocConnectorCatalog.test.ts
          server/cadDesign/stepFileValidation.test.ts
          server/cadDesign/connectionGeometry.test.ts
          server/middleware.test.ts
          src/pages/ProjectDetails/RoutingsViewerTab.test.tsx
          src/ProjectAccess.test.tsx
      - name: Protected iframe CAD protocol tests
        run: node --test viewer-runtime/test/cad-protocol.node-test.mjs
      - name: Backend build
        run: npm run server:build

  converter:
    name: Offline OCCT CAD converter smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated converter image
        run: docker build -f Dockerfile.poc-converter -t wfc-aalborg-cad-test:ci .
      - name: Export STEP and reimport both synthetic solids
        run: >
          docker run --rm --pull never --network none --read-only
          --tmpfs /tmp:size=64m --memory=1g --cpus=2
          --entrypoint python wfc-aalborg-cad-test:ci /app/smoke.py

name: Validate LAN HTTP browser compatibility
on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'viewer-runtime/**'
      - 'scripts/viewer-runtime/module-closure*'
      - 'scripts/copy-pathfinder-contracts.mjs'
      - 'package*.json'
      - '.github/workflows/http-crypto-validation.yml'
permissions:
  contents: read
jobs:
  http-crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
    env:
      VITE_API_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify crypto fallbacks and runtime module packaging
        run: node --test viewer-runtime/test/generate-id.test.mjs viewer-runtime/test/sha256.test.mjs viewer-runtime/test/producer-host.test.mjs viewer-runtime/test/barrier-multipart-transport.test.mjs viewer-runtime/test/bridge.test.mjs scripts/viewer-runtime/module-closure.test.mjs
      - name: Verify HTTP panel and integrity regressions
        run: npm test -- --run --pool=threads --maxWorkers=1 --fileParallelism=false --testTimeout=20000 src/api/httpCryptoCompatibility.test.ts src/pages/ProjectDetails/EndpointBindingPanel.test.tsx src/pages/ProjectDetails/hooks/useRoutingsViewer.test.ts
      - name: Check application and server types
        run: npm run typecheck
      - name: Build server with shared runtime dependencies
        run: npm run server:build

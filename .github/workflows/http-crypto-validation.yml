name: Validate viewer and tray workflows
on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'server/**'
      - 'viewer-runtime/**'
      - 'scripts/viewer-runtime/module-closure*'
      - 'scripts/copy-pathfinder-contracts.mjs'
      - 'package*.json'
      - '.github/workflows/http-crypto-validation.yml'
permissions:
  contents: read
jobs:
  http-crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: node@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wfc_tray_auto_length_test
        options: >-
          --health-cmd "pg_isready -U postgres -d wfc_tray_auto_length_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VITE_API_URL: http://127.0.0.1:1
      WFC_TRAY_LENGTH_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wfc_tray_auto_length_test
      DATABASE_URL: postgresql://unit:unit@127.0.0.1:1/unit
      JWT_SECRET: unit-only-secret-never-used-in-production
      MINIO_ACCESS_KEY: unit
      MINIO_SECRET_KEY: unit-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify crypto fallbacks and runtime module packaging
        run: node --test viewer-runtime/test/generate-id.test.mjs viewer-runtime/test/sha256.test.mjs viewer-runtime/test/producer-host.test.mjs viewer-runtime/test/barrier-multipart-transport.test.mjs viewer-runtime/test/bridge.test.mjs scripts/viewer-runtime/module-closure.test.mjs
      - name: Verify HTTP panel and integrity regressions
        run: npm test -- --run --pool=threads --maxWorkers=1 --fileParallelism=false --testTimeout=20000 src/api/httpCryptoCompatibility.test.ts src/pages/ProjectDetails/EndpointBindingPanel.test.tsx src/pages/ProjectDetails/hooks/useRoutingsViewer.test.ts
      - name: Verify tray Ghost and appearance restoration
        run: node --test --test-concurrency=2 viewer-runtime/test/adapter.test.mjs viewer-runtime/test/pathfinder.test.mjs
      - name: Verify tray Show and Hide lifecycle
        run: npm test -- --run --pool=threads --maxWorkers=1 --fileParallelism=false --testTimeout=20000 src/pages/ProjectDetails/ProjectPreparationPanel.test.tsx src/pages/ProjectDetails/hooks/usePathFinder.test.tsx src/viewer/ViewerController.test.ts
      - name: Verify tray Auto-length and manual-value approval
        run: npm test -- --run --pool=threads --maxWorkers=1 --fileParallelism=false --testTimeout=20000 src/api/trays.test.ts src/pages/TrayDetails/TrayDetails.autoLength.test.ts src/pages/TrayDetails/components/TrayEditForm.autoLength.test.tsx server/middleware.test.ts server/models/tray.test.ts server/validators.tray.test.ts server/services/trayAutoLengthService.test.ts server/services/trayAutoLengthService.postgres.test.ts server/services/trayChangeLogService.test.ts server/routes/traysRoutes.test.ts server/routes/projectExcelImportValidation.test.ts
      - name: Check application and server types
        run: npm run typecheck
      - name: Build server with shared runtime dependencies
        run: npm run server:build

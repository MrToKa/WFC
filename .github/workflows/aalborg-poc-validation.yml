name: Aalborg Routings Builder PoC Validation

on:
  push:
    branches:
      - feature/aalborg-step-routings-builder-poc-20261110
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aalborg-routings-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      material-cad-postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-disposable-ci-only
          POSTGRES_DB: wfc_material_cad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wfc_material_cad_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://example:example@127.0.0.1:5432/unused_test
      JWT_SECRET: intentionally-nonproduction-ci-only
      MINIO_ACCESS_KEY: synthetic-ci-only
      MINIO_SECRET_KEY: synthetic-ci-only
      WFC_MATERIAL_CAD_TEST_DATABASE_URL: postgresql://postgres:synthetic-disposable-ci-only@127.0.0.1:5432/wfc_material_cad_test
    steps:
      - name: Checkout exact PoC source
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Setup routing engine SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build routing engine with CAD network overlays
        run: dotnet build pathfinder-engine/tools/PathFinder.ModelRunner --configuration Release
      - name: Verify actual routing through a published CAD overlay
        env:
          PF_MODEL_RUNNER_DLL: ${{ github.workspace }}/pathfinder-engine/tools/PathFinder.ModelRunner/bin/Release/net9.0/PathFinder.ModelRunner.dll
        run: npx vitest run --maxWorkers=1 --minWorkers=1 --testTimeout=45000 server/pathfinder/cadOverlay.engine.test.ts
      - name: CAD route groups and network publication
        run: npx vitest run --maxWorkers=1 --minWorkers=1 --testTimeout=15000 server/cadDesign/routeGroups.test.ts server/cadDesign/routePublication.test.ts server/cadDesign/routePublication.http.test.ts server/cadDesign/routeAlignment.test.ts server/cadDesign/routeAutoConnections.test.ts server/cadDesign/routeTrayExports.test.ts server/models/tray.test.ts server/validators.tray.test.ts src/pages/TrayDetails/TrayDetails.autoLength.test.ts server/pathfinder/cadOverlay.test.ts src/pages/ProjectDetails/CadRoutesPanel.test.tsx
      - name: Isolated installation transition migration and lifecycle
        env:
          WFC_CAD_TRANSITIONS_POSTGRES_TESTS: '1'
        run: |
          docker pull postgres:16-alpine
          npx vitest run --maxWorkers=1 --minWorkers=1 --testTimeout=30000 server/cadDesign/routeTransitionsSchema.postgres.test.ts
      - name: Typecheck frontend and server
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Focused CAD tests
        run: npx vitest run --maxWorkers=1 --minWorkers=1 --testTimeout=15000 src/viewer/ViewerController.test.ts src/viewer/componentTransforms.test.ts server/cadDesign/stepFileValidation.test.ts server/cadDesign/connectionGeometry.test.ts src/viewer/pocConnectorCatalog.test.ts server/middleware.test.ts src/pages/ProjectDetails/RoutingsViewerTab.test.tsx src/ProjectAccess.test.tsx
      - name: Materials catalogue and pinned revision regression tests
        run: npx vitest run --maxWorkers=1 --minWorkers=1 --testTimeout=15000 server/materialCad server/cadDesign/isolation.test.ts server/cadDesign/catalogReferences.test.ts server/cadDesign/instanceDeletion.test.ts server/cadDesign/lengths.test.ts server/cadDesign/lengthConverter.test.ts src/pages/Materials/components/MaterialComponentsSection.test.tsx src/pages/Materials/components/TraysTable.test.tsx src/pages/Materials/MasterMaterialDetailsPage.test.tsx src/pages/ProjectDetails/CadComponentsPanel.test.tsx src/pages/ProjectDetails/CadPlacementPanel.test.tsx src/pages/ProjectDetails/CadLengthPanel.test.tsx shared/cadRotation.test.ts
      - name: Complete Materials navigation, filters and return-state regression
        run: npx vitest run --maxWorkers=1 --minWorkers=1 --testTimeout=15000 src/pages/Materials.test.tsx
      - name: Isolated catalogue snapshot guards
        run: node --test scripts/poc/clone-materials-catalog.test.mjs
      - name: Compile frontend
        run: npm run build
      - name: Compile server
        run: npm run server:build
      - name: Protected CAD protocol contracts
        run: node --test scripts/viewer-runtime/module-closure.test.mjs viewer-runtime/test/cad-protocol.node-test.mjs
      - name: Dynamic CAD Scene API isolation and transform tests
        run: node --test viewer-runtime/test/cad-scene.node-test.mjs
      - name: Python converter syntax
        run: python -m py_compile scripts/poc/step-mesh-converter.py
      - name: Build isolated CAD kernel image
        run: docker build -f Dockerfile.poc-converter -t wfc-aalborg-cad-test:ci .
      - name: Test exact CAD assembly in isolated worker
        run: docker run --rm --pull never --network none --read-only --tmpfs /tmp:size=64m --memory=1g --cpus=2 --entrypoint python wfc-aalborg-cad-test:ci /app/smoke.py
      - name: Validate isolated Compose syntax
        env:
          POC_POSTGRES_PASSWORD: synthetic-ci-123456789012345678901234
          POC_MINIO_USER: wfc_poc
          POC_MINIO_PASSWORD: synthetic-ci-123456789012345678901234
          POC_JWT_SECRET: synthetic-ci-123456789012345678901234
          POC_CONVERTER_TOKEN: synthetic-ci-123456789012345678901234
        run: docker compose -f compose.poc.yaml -p wfc-aalborg-poc config --quiet
